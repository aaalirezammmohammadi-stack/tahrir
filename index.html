<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="metaThemeColor">
<title>لیست قیمت و سفارش عمده</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://developer.eitaa.com">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" as="style">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" media="print" onload="this.media='all'">
<noscript><link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css"></noscript>

<link rel="preload" href="products.txt" as="fetch" crossorigin>

<!-- کیت توسعه برنامک ایتا -->
<script src="https://developer.eitaa.com/eitaa-web-app.js" defer></script>

<style>
/* ============================================================
   لایه ۱ — توکن‌های طراحی (بقیه CSS فقط از این‌ها استفاده می‌کند)
   ============================================================ */
:root{
  --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:16px;
  --fs-sm:12.5px; --fs-base:14px; --fs-lg:15px;
  --sp:12px;
}

[data-theme="light"]{
  --bg:#f1f2f4;
  --surface:#ffffff;
  --surface-2:#f5f6f8;
  --text:#12161c;
  --muted:#707b87;
  --border:#e3e6ea;
  --accent:#2f6feb;      --accent-rgb:47,111,235;
  --accent-contrast:#ffffff;
  --danger:#e04447;      --danger-rgb:224,68,71;
  --success:#12a150;
  --overlay:rgba(15,20,26,.45);
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.06);
}

[data-theme="dark"]{
  --bg:#0e1621;
  --surface:#17212b;
  --surface-2:#1e2a36;
  --text:#e9edf1;
  --muted:#8d9aa8;
  --border:#26333f;
  --accent:#5a9bf6;      --accent-rgb:90,155,246;
  --accent-contrast:#0b1219;
  --danger:#ef6a6d;      --danger-rgb:239,106,109;
  --success:#3ecf8e;
  --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
}

/* ============================================================
   پایه
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;
  font-size:var(--fs-base);
  line-height:1.65;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
  transition:background-color .25s ease, color .25s ease;
}
button,input,textarea{font-family:inherit}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

/* ============================================================
   نوار بالایی چسبان
   ============================================================ */
.topbar{
  position:sticky; top:0; z-index:50;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:8px 12px 10px;
  display:flex; flex-direction:column; gap:9px;
  padding-top:calc(8px + env(safe-area-inset-top));
}

/* ردیف جستجو */
.search-row{display:flex; gap:8px; align-items:center}
.search{position:relative; flex:1; min-width:0}
.search input{
  width:100%; height:42px;
  padding:0 40px 0 38px;
  border:1px solid var(--border); border-radius:var(--r-md);
  background:var(--surface-2); color:var(--text);
  font-size:14px; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16);
}
.search .s-icon{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  color:var(--muted); pointer-events:none; display:flex;
}
.search .s-clear{
  position:absolute; left:7px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border:none; border-radius:50%;
  background:var(--border); color:var(--muted);
  display:none; align-items:center; justify-content:center; cursor:pointer;
}
.search.has-value .s-clear{display:flex}

.icon-btn{
  flex:none; width:42px; height:42px;
  border:1px solid var(--border); border-radius:var(--r-md);
  background:var(--surface-2); color:var(--text);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background-color .15s;
}
.icon-btn:active{background:var(--border)}

/* ردیف‌های تگ (اسلایدر بی‌نهایت) */
.chips{display:flex; flex-direction:column; gap:6px}
.marquee{
  display:flex; overflow-x:auto; width:100%;
  user-select:none; scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  will-change:scroll-position; transform:translateZ(0);
}
.marquee::-webkit-scrollbar{display:none}
.marquee-content{display:flex; flex-shrink:0; gap:6px; padding-right:6px}
.chip{
  padding:5px 12px;
  border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface-2); color:var(--muted);
  font-size:var(--fs-sm); font-weight:600;
  white-space:nowrap; cursor:pointer; direction:rtl;
  transition:background-color .15s, color .15s, border-color .15s;
}
.chip:active{
  background:var(--accent); color:var(--accent-contrast);
  border-color:var(--accent);
}

/* ============================================================
   لیست کالاها
   ============================================================ */
.list{
  padding:10px 12px 0;
  display:flex; flex-direction:column; gap:6px;
  animation:fadeIn .3s ease-out;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.item{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-md);
  padding:11px 14px; cursor:pointer;
  transition:background-color .15s;
}
.item:active{background:var(--surface-2)}
.item-name{flex:1; min-width:0; font-size:var(--fs-base); font-weight:500}
.item-price{
  flex:none; font-size:13.5px; font-weight:700;
  color:var(--accent); background:rgba(var(--accent-rgb),.1);
  padding:4px 9px; border-radius:7px; white-space:nowrap;
}

.status{text-align:center; color:var(--muted); font-size:var(--fs-sm); padding:16px 12px}
.empty{text-align:center; padding:48px 20px; color:var(--muted)}
.empty b{display:block; color:var(--text); font-size:15px; margin-bottom:6px}

/* ============================================================
   دکمه شناور سبد
   ============================================================ */
.fab{
  position:fixed; left:16px; z-index:60;
  bottom:calc(16px + env(safe-area-inset-bottom));
  width:56px; height:56px;
  border:none; border-radius:var(--r-xl);
  background:var(--accent); color:var(--accent-contrast);
  display:none; align-items:center; justify-content:center;
  box-shadow:0 6px 20px rgba(var(--accent-rgb),.35);
  cursor:pointer; transition:transform .15s;
}
.fab:active{transform:scale(.94)}
.fab-badge{
  position:absolute; top:-6px; right:-6px;
  min-width:22px; height:22px; padding:0 5px;
  border-radius:11px; background:var(--danger); color:#fff;
  font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--bg);
}

/* ============================================================
   مودال‌ها
   ============================================================ */
.modal{
  display:none; position:fixed; inset:0; z-index:100;
  background:var(--overlay);
  align-items:center; justify-content:center; padding:16px;
}
.sheet{
  width:100%; max-width:380px; max-height:86vh;
  background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-xl);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:var(--shadow);
  animation:pop .22s cubic-bezier(.16,1,.3,1);
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (max-width:430px){
  .modal{padding:0; align-items:flex-end}
  .sheet{max-width:none; max-height:92vh; border-radius:var(--r-xl) var(--r-xl) 0 0; border-bottom:none; animation:slideUp .24s ease-out}
}

.sheet-head{
  padding:14px 16px; border-bottom:1px solid var(--border);
  font-size:var(--fs-lg); font-weight:700; text-align:center; line-height:1.5;
}
.sheet-body{padding:16px; overflow-y:auto}
.sheet-foot{
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  display:flex; flex-direction:column; gap:8px;
}

.meta-pill{
  display:block; width:fit-content; margin:0 auto 16px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:6px 12px;
  color:var(--muted); font-size:13px; font-weight:600;
}
.total-line{
  margin-top:16px; padding-top:14px;
  border-top:1px dashed var(--border);
  text-align:center; font-size:var(--fs-lg); font-weight:800; color:var(--accent);
}

/* شمارنده تعداد */
.qty{
  display:flex; align-items:center; justify-content:center; gap:4px;
  width:fit-content; margin:0 auto;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:4px;
}
.qty button{
  width:40px; height:40px; border:none; border-radius:9px;
  background:var(--surface); color:var(--text);
  font-size:20px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform .12s;
}
.qty button:active{transform:scale(.9)}
.qty input{
  width:66px; height:40px; text-align:center;
  border:none; background:transparent; color:var(--text);
  font-size:17px; font-weight:800;
}

/* دکمه‌ها */
.btn{
  height:44px; padding:0 14px;
  border:1px solid transparent; border-radius:var(--r-md);
  font-size:var(--fs-base); font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:opacity .15s, transform .12s;
}
.btn:active{transform:scale(.985); opacity:.9}
.btn-primary{background:var(--accent); color:var(--accent-contrast)}
.btn-ghost{background:transparent; color:var(--muted); border-color:var(--border)}
.btn-danger{background:rgba(var(--danger-rgb),.1); color:var(--danger); border-color:rgba(var(--danger-rgb),.35)}
.btn-solid-danger{background:var(--danger); color:#fff}
.btn-eitaa{background:#E85D04; color:#fff}
.btn-telegram{background:#229ED9; color:#fff}

/* سبد خرید */
.cart-list{max-height:44vh; overflow-y:auto; margin:-4px -4px 0; padding:4px}
.cart-item{
  display:flex; align-items:flex-start; gap:10px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--r-md); padding:10px 12px; margin-bottom:8px;
}
.cart-item:last-child{margin-bottom:0}
.cart-main{flex:1; min-width:0}
.cart-name{font-size:13.5px; font-weight:700; margin-bottom:8px; line-height:1.5}
.cart-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.cart-qty{
  display:flex; align-items:center; gap:2px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:2px;
}
.cart-qty button{
  width:28px; height:28px; border:none; background:transparent;
  color:var(--accent); font-size:17px; font-weight:800; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.cart-qty span{min-width:26px; text-align:center; font-size:13px; font-weight:800}
.cart-calc{font-size:13px; font-weight:800; color:var(--accent); background:rgba(var(--accent-rgb),.1); padding:3px 8px; border-radius:6px}
.cart-del{
  flex:none; width:32px; height:32px; border:none; border-radius:var(--r-sm);
  background:rgba(var(--danger-rgb),.1); color:var(--danger);
  font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.note{font-size:13.5px; line-height:1.9; color:var(--text); text-align:center}
.note b{color:var(--success)}
</style>
</head>
<body>

<!-- ================= نوار بالا ================= -->
<div class="topbar">

  <div class="search-row">
    <div class="search" id="searchWrap">
      <span class="s-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" id="myInput" oninput="debouncedSearch()" placeholder="جستجوی نام کالا..." autocomplete="off">
      <button class="s-clear" onclick="clearSearch()" aria-label="پاک کردن">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <button class="icon-btn" id="themeBtn" onclick="cycleTheme()" aria-label="تغییر تم"></button>
  </div>

  <div class="chips">
    <div class="marquee" id="marquee-cats">
      <div class="marquee-content" id="cat-content-1"></div>
      <div class="marquee-content" id="cat-content-2"></div>
    </div>
    <div class="marquee" id="marquee-brands">
      <div class="marquee-content" id="brand-content-1"></div>
      <div class="marquee-content" id="brand-content-2"></div>
    </div>
  </div>

</div>

<!-- ================= لیست ================= -->
<div class="list" id="itemList"></div>
<div class="status" id="status">در حال بارگذاری...</div>

<!-- ================= دکمه سبد ================= -->
<button class="fab" id="cartFab" onclick="openCartModal()" aria-label="سبد سفارش">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>
    <path d="M2.5 3h2.2l2.4 12.1a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.3L21 7H6"/>
  </svg>
  <span class="fab-badge" id="cartBadge">0</span>
</button>

<!-- ================= مودال سفارش ================= -->
<div id="orderModal" class="modal" onclick="closeModalOnBG(event,'orderModal')">
  <div class="sheet">
    <div class="sheet-head" id="modalItemName">نام کالا</div>
    <div class="sheet-body">
      <span class="meta-pill" id="modalItemPrice">قیمت واحد: ۰ تومان</span>
      <div class="qty">
        <button onclick="changeQty(1)" aria-label="افزایش">+</button>
        <input type="number" inputmode="numeric" id="modalQty" value="1" min="1"
               onfocus="clearInputOnFocus(this)" onblur="restoreInputOnBlur(this)" oninput="calcTotal()">
        <button onclick="changeQty(-1)" aria-label="کاهش">−</button>
      </div>
      <div class="total-line" id="modalTotal">جمع کل: ۰ تومان</div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-primary" onclick="addToCart()">افزودن به سبد سفارش</button>
      <button class="btn btn-ghost" onclick="closeModal('orderModal')">انصراف</button>
    </div>
  </div>
</div>

<!-- ================= مودال سبد ================= -->
<div id="cartModal" class="modal" onclick="closeModalOnBG(event,'cartModal')">
  <div class="sheet">
    <div class="sheet-head">پیش‌فاکتور شما</div>
    <div class="sheet-body">
      <div id="cartItemsList" class="cart-list"></div>
      <div class="total-line" id="cartSumTotal">جمع کل: ۰ تومان</div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-eitaa" onclick="sendOrderEitaa()">ارسال سفارش در ایتا</button>
      <button class="btn btn-telegram" onclick="sendOrderTelegram()">ارسال سفارش در تلگرام</button>
      <button class="btn btn-danger" onclick="openConfirmClearModal()">حذف تمام سفارشات</button>
      <button class="btn btn-ghost" onclick="closeModal('cartModal')">بستن / ادامه خرید</button>
    </div>
  </div>
</div>

<!-- ================= مودال تایید حذف ================= -->
<div id="confirmClearModal" class="modal" onclick="closeModalOnBG(event,'confirmClearModal')">
  <div class="sheet">
    <div class="sheet-head">حذف کل سبد خرید</div>
    <div class="sheet-body">
      <div class="note">آیا از حذف تمام کالاهای سبد خرید مطمئن هستید؟</div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-solid-danger" onclick="confirmClearCart()">بله، حذف کن</button>
      <button class="btn btn-ghost" onclick="closeModal('confirmClearModal')">انصراف</button>
    </div>
  </div>
</div>

<!-- ================= مودال ایتا ================= -->
<div id="eitaaModal" class="modal" onclick="closeModalOnBG(event,'eitaaModal')">
  <div class="sheet">
    <div class="sheet-head"><b style="color:var(--success)">متن سفارش کپی شد</b></div>
    <div class="sheet-body">
      <div class="note">
        سفارش شما در حافظه کپی شد.<br>
        پس از ورود به صفحه چت واحد فروش، متن را جای‌گذاری (Paste) و ارسال نمایید.
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-primary" onclick="redirectToEitaa()">متوجه شدم</button>
      <button class="btn btn-ghost" onclick="closeModal('eitaaModal')">بستن</button>
    </div>
  </div>
</div>


<script>
/* ============================================================
   ۰) آداپتور برنامک ایتا و تم
   ============================================================ */
function getWebApp(){
  if (typeof window.Eitaa !== 'undefined' && window.Eitaa.WebApp) return window.Eitaa.WebApp;
  return null;
}

/* تشخیص نسخهٔ کلاینت (اندروید/دسکتاپ در برابر نسخهٔ وب) از طریق خود SDK ایتا —
   نه از روی User-Agent، چون تشخیص مبتنی بر UA قبلاً با کلاینت ایتا مشکل ایجاد می‌کرد.
   خود برنامک همان فیلد platform را که در مستندات مینی‌اپ تلگرام تعریف شده برمی‌گرداند. */
function getClientPlatform(){
  var app = getWebApp();
  if(!app) return null;
  var v = app.platform || app.platformType || app.platform_type || app.clientPlatform || app.client_platform || null;
  return v ? String(v).toLowerCase() : null;
}
var WEB_CLIENT_PLATFORMS = ['web','weba','webk','webview','browser'];
function isWebClient(){
  var p = getClientPlatform();
  if(!p) return false;   // اگر پلتفرم قابل تشخیص نبود، نسخهٔ بومی (اندروید/دسکتاپ) فرض می‌شود
  return WEB_CLIENT_PLATFORMS.indexOf(p) > -1;
}

/* --- ابزار رنگ --- */
function hexToRgb(h){
  if(!h) return null;
  h = String(h).trim().replace('#','');
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
}
function rgbToHex(a){
  return '#'+a.map(function(v){ v=Math.max(0,Math.min(255,Math.round(v))); return ('0'+v.toString(16)).slice(-2); }).join('');
}
function shade(hex, amt){                  // amt مثبت = روشن‌تر، منفی = تیره‌تر
  var c = hexToRgb(hex); if(!c) return hex;
  var t = amt>0 ? 255 : 0, p = Math.abs(amt);
  return rgbToHex(c.map(function(v){ return v + (t-v)*p; }));
}
function isDarkHex(hex){
  var c = hexToRgb(hex); if(!c) return false;
  return (0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2]) / 255 < 0.5;
}
function rgbTriplet(hex, fallback){
  var c = hexToRgb(hex);
  return c ? c.join(',') : fallback;
}

/* برای اطمینان، چند حالت رایج نام‌گذاری کلیدهای themeParams در ایتا را امتحان می‌کنیم */
function pick(obj, keys){
  if(!obj) return null;
  for(var i=0;i<keys.length;i++){
    var v = obj[keys[i]];
    if(typeof v === 'string' && v.charAt(0) === '#') return v;
  }
  return null;
}
function readThemeParams(){
  var app = getWebApp();
  if(!app) return null;
  var tp = app.themeParams || app.theme_params || null;
  if(tp && Object.keys(tp).length) return tp;

  /* پشتیبان: خواندن CSS Variableهایی که خود کلاینت ایتا ممکن است تزریق کند */
  var cs = getComputedStyle(document.documentElement);
  var probe  = ['bg','text','hint','button','button-text','secondary-bg','link','destructive-text','section-bg','section-separator'];
  var prefixes = ['--eitaa-theme-','--tg-theme-'];
  var out = {}, found = false;
  for(var p=0;p<prefixes.length;p++){
    for(var i=0;i<probe.length;i++){
      var v = cs.getPropertyValue(prefixes[p]+probe[i]+'-color').trim();
      if(v){ out[probe[i].replace(/-/g,'_')+'_color'] = v; found = true; }
    }
    if(found) break;
  }
  return found ? out : null;
}

var THEME_KEY = 'priceListThemeMode';
function safeGetLS(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeSetLS(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }
var themeMode = safeGetLS(THEME_KEY) || 'auto';   // auto | light | dark
var PLATFORM_VARS = ['--bg','--surface','--surface-2','--text','--muted','--border',
                     '--accent','--accent-rgb','--accent-contrast','--danger','--danger-rgb'];

function clearPlatformVars(){
  for(var i=0;i<PLATFORM_VARS.length;i++) document.documentElement.style.removeProperty(PLATFORM_VARS[i]);
}

function applyPlatformTheme(tp, dark){
  var S = document.documentElement.style;

  var surface = pick(tp, ['section_bg_color','sectionBgColor','bg_color','bgColor','background_color','backgroundColor']);
  var page    = pick(tp, ['secondary_bg_color','secondaryBgColor']);
  var text    = pick(tp, ['text_color','textColor','font_color']);
  var muted   = pick(tp, ['hint_color','hintColor','subtitle_text_color','secondary_text_color']);
  var accent  = pick(tp, ['button_color','buttonColor','link_color','linkColor','accent_text_color','primary_color']);
  var onAcc   = pick(tp, ['button_text_color','buttonTextColor']);
  var danger  = pick(tp, ['destructive_text_color','destructiveTextColor']);
  var border  = pick(tp, ['section_separator_color','sectionSeparatorColor','separator_color']);

  if(!surface) return false;                       // چیزی برای اعمال نداریم

  if(!page || page.toLowerCase() === surface.toLowerCase())
    page = shade(surface, dark ? -0.30 : -0.045);
  if(!border) border = shade(surface, dark ? 0.14 : -0.10);

  S.setProperty('--surface',   surface);
  S.setProperty('--surface-2', shade(surface, dark ? 0.07 : -0.028));
  S.setProperty('--bg',        page);
  S.setProperty('--border',    border);
  if(text)  S.setProperty('--text',  text);
  if(muted) S.setProperty('--muted', muted);
  if(accent){
    S.setProperty('--accent', accent);
    S.setProperty('--accent-rgb', rgbTriplet(accent, dark?'90,155,246':'47,111,235'));
    S.setProperty('--accent-contrast', onAcc || (isDarkHex(accent) ? '#ffffff' : '#101418'));
  }
  if(danger){
    S.setProperty('--danger', danger);
    S.setProperty('--danger-rgb', rgbTriplet(danger, dark?'239,106,109':'224,68,71'));
  }
  return true;
}

function refreshTheme(){
  var app = getWebApp();
  var tp  = readThemeParams();
  var dark;

  if(themeMode === 'light' || themeMode === 'dark'){
    clearPlatformVars();
    dark = (themeMode === 'dark');
  } else if(tp){
    var scheme = app && (app.colorScheme || app.color_scheme);
    dark = scheme ? (scheme === 'dark')
                  : isDarkHex(pick(tp,['bg_color','bgColor','section_bg_color']) || '#ffffff');
    clearPlatformVars();
    if(!applyPlatformTheme(tp, dark)) clearPlatformVars();
  } else {
    clearPlatformVars();
    dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

  /* هماهنگ‌سازی نوار سیستم */
  var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  var sf = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim();
  var meta = document.getElementById('metaThemeColor');
  if(meta) meta.setAttribute('content', sf || bg);
  try{ app && app.setBackgroundColor && app.setBackgroundColor(bg); }catch(e){}
  try{ app && app.setHeaderColor     && app.setHeaderColor(sf);     }catch(e){}

  renderThemeIcon();
}

/* اسکرول بی‌نهایت مبتنی بر Delta Time (عیناً مثل نسخه قبل) */
function setupMarqueeTouchAndAuto(elementId, speed){
  var el = document.getElementById(elementId);
  if(!el) return;
  el.dir = "ltr";

  var isInteracting = false, timeoutId = null, exactScroll = 0, lastTimestamp = null;

  setTimeout(function(){
    var halfWidth = el.scrollWidth / 2;
    exactScroll = (speed < 0) ? halfWidth : 0;
    el.scrollLeft = exactScroll;

    function checkWrap(){
      halfWidth = el.scrollWidth / 2;
      if(speed > 0){
        if(exactScroll >= halfWidth) exactScroll -= halfWidth;
        else if(exactScroll <= 0)    exactScroll += halfWidth;
      }else{
        if(exactScroll <= 0)         exactScroll += halfWidth;
        else if(exactScroll >= halfWidth) exactScroll -= halfWidth;
      }
    }

    function scrollLoop(timestamp){
      if(!lastTimestamp) lastTimestamp = timestamp;
      var deltaTime = timestamp - lastTimestamp;
      lastTimestamp = timestamp;
      if(deltaTime > 100) deltaTime = 16.66;

      if(!isInteracting){
        exactScroll += speed * (deltaTime / 16.66);
        checkWrap();
        el.scrollLeft = exactScroll;
      }else{
        exactScroll = el.scrollLeft;
      }
      requestAnimationFrame(scrollLoop);
    }

    el.addEventListener('scroll', function(){ if(isInteracting) checkWrap(); }, {passive:true});

    function startInteract(){ isInteracting = true; clearTimeout(timeoutId); }
    function endInteract(){
      timeoutId = setTimeout(function(){ isInteracting = false; lastTimestamp = null; }, 1500);
    }
    el.addEventListener('touchstart', startInteract, {passive:true});
    el.addEventListener('touchend',   endInteract,   {passive:true});
    el.addEventListener('mousedown',  startInteract);
    el.addEventListener('mouseup',    endInteract);
    el.addEventListener('mouseleave', endInteract);

    requestAnimationFrame(scrollLoop);
  }, 150);
}

/* ============================================================
   بارگذاری کالاها از فایل جدا (products.txt)
   - اگر نسخهٔ ذخیره‌شده در مرورگر باشد، همان لحظه نمایش داده می‌شود
   - همزمان فایل از سرور بررسی می‌شود؛ فقط اگر تغییر کرده باشد لیست به‌روز می‌شود
   ============================================================ */
var PRODUCTS_URL = 'products.txt';
var PRODUCTS_KEY = 'productsTxtV1';
function loadProducts(){
  var cached = safeGetLS(PRODUCTS_KEY);
  if(cached) processData(cached);
  fetch(PRODUCTS_URL, { cache: 'no-cache' })
    .then(function(r){ if(!r.ok) throw new Error('bad status'); return r.text(); })
    .then(function(t){
      if(!t || t === cached) return;
      safeSetLS(PRODUCTS_KEY, t);
      processData(t);
      if(document.getElementById('myInput').value) doSearch();
    })
    .catch(function(){ if(!cached) processData(''); });
}

var searchTimeout;
function debouncedSearch(){
  toggleClearBtn();
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(doSearch, 300);
}
function doSearch(){
  var val = normalize(document.getElementById("myInput").value).trim();
  if(!val){ showItems(allItems); return; }
  var words = val.split(/\s+/);
  var filtered = allItems.filter(function(item){
    return words.every(function(word){ return item.sn.indexOf(word) > -1; });
  });
  showItems(filtered);
}

/* ============================================================
   ۴) پردازش داده و رندر لیست
   ============================================================ */
function processData(text){
  var lines = text.split("\n");
  var originalIndex = 0, tempItems = [];

  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line || line.indexOf("!!!") === 0) continue;

    var parts = line.split("\t");
    if(parts.length < 2){                                  // پشتیبان: فاصله به‌جای TAB
      var m = line.match(/^([\d۰-۹,\.]+)\s+(.+)$/);
      if(m) parts = [m[1], m[2]];
    }
    if(parts.length >= 2){
      var p = parseInt(parts[0].replace(/,/g,'').replace(/"/g,''), 10);
      var n = parts[1].replace(/"/g,'').trim();
      if(!isNaN(p) && n) tempItems.push({ id: originalIndex++, p: p, n: n, sn: normalize(n) });
    }
  }
  allItems = tempItems;

  /* همگام‌سازی سبد با قیمت‌های جدید */
  var cartUpdated = false;
  for(var c=0;c<cart.length;c++){
    var liveItem = allItems.find(function(item){ return item.n === cart[c].name; });
    if(liveItem){
      if(cart[c].price !== liveItem.p){ cart[c].price = liveItem.p; cartUpdated = true; }
    }else{
      cart.splice(c,1); c--; cartUpdated = true;
    }
  }
  if(cartUpdated) saveCart();

  showItems(allItems);
  updateCartUI();
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

function showItems(items){
  var listEl   = document.getElementById("itemList");
  var statusEl = document.getElementById("status");

  if(items.length === 0){
    listEl.innerHTML = '<div class="empty"><b>کالایی پیدا نشد</b>عبارت دیگری را جستجو کنید.</div>';
    statusEl.innerText = "";
    return;
  }

  var limit = Math.min(items.length, 150);
  var html = "";
  for(var i=0;i<limit;i++){
    html += '<div class="item" onclick="openOrderModalByIndex(' + items[i].id + ')">' +
              '<span class="item-name">'  + escapeHTML(items[i].n) + '</span>' +
              '<span class="item-price">' + formatToToman(items[i].p) + '</span>' +
            '</div>';
  }
  listEl.innerHTML = html;
  statusEl.innerText = "نمایش " + limit + " مورد از " + items.length + " کالا (برای سفارش کلیک کنید)";
}

function formatToToman(n){
  var num = parseInt(n, 10);
  if(isNaN(num)) return n;
  var toman = Math.floor(num / 10);
  return toman.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + " تومان";
}

/* ============================================================
   ۷) ارسال سفارش
   ============================================================ */
function openSafeLink(url, isEitaaLink){
  var app = getWebApp();
  if(app){
    try{
      /* روی نسخهٔ اندروید/دسکتاپ ایتا، openEitaaLink پی‌وی ادمین را به‌درستی باز می‌کند.
         روی نسخهٔ وب ایتا (که مثل مینی‌اپ‌های تلگرام وب رفتار می‌کند) این متد کار نمی‌کند؛
         در آن حالت طبق همان روش استاندارد بازکردن لینک خارجی در مینی‌اپ عمل می‌کنیم که
         خود کلاینت وب ایتا آن را به‌درستی به پی‌وی ادمین هدایت می‌کند. */
      if(isEitaaLink && !isWebClient() && typeof app.openEitaaLink === 'function'){
        app.openEitaaLink(url);
        return;
      }
      if(typeof app.openLink === 'function'){ app.openLink(url, { try_browser: true }); return; }
    }catch(e){ console.log("WebApp API Error:", e); }
  }
  var a = document.createElement('a');

function getOrderMessageText(){
  if(cart.length === 0) return "";
  var message = "📋 سلام، درخواست سفارش جدید:\n\n";
  var finalSum = 0;
  for(var i=0;i<cart.length;i++){
    var item = cart[i];
    finalSum += item.price * item.qty;
    message += "🔹 " + (i+1) + ". " + item.name +
               "\n     تعداد: " + item.qty + " عدد | فی: " + formatToToman(item.price) + "\n";
  }
  message += "\n💰 جمع کل سفارش: " + formatToToman(finalSum);
  return message;
}

function sendOrderEitaa(){
  var text = getOrderMessageText(); if(!text) return;

  var copyToClipboard = function(str){
    if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(str);
    return new Promise(function(resolve, reject){
      var ta = document.createElement("textarea");
      ta.value = str; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand('copy') ? resolve() : reject(); }catch(err){ reject(); }
      document.body.removeChild(ta);
    });
  };

  copyToClipboard(text)
    .then(function(){ openModal("eitaaModal"); })
    .catch(function(){
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      openModal("eitaaModal");
    });
}
