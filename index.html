<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>در حال انبارگردانی</title>
<style>
  :root {
    --bg: #eef2f6;
    --ink: #14283d;
    --steel: #5b7188;
    --yellow: #ffbf1f;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Vazirmatn", "Vazir", "IRANSans", Tahoma, "Segoe UI", system-ui, sans-serif;
    line-height: 1.9;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .tape {
    height: 14px;
    flex: none;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 18px, var(--ink) 18px 36px);
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 28px 20px;
    display: grid;
    gap: 8px 48px;
    align-items: center;
    justify-items: center;
    text-align: center;
  }

  .art { width: min(380px, 84vw); }
  .art svg { display: block; width: 100%; height: auto; overflow: visible; }

  h1 {
    margin: 0 0 22px;
    font-size: clamp(28px, 7vw, 46px);
    line-height: 1.5;
    font-weight: 800;
  }

  .progress {
    height: 12px;
    border-radius: 6px;
    background: #dbe3eb;
    overflow: hidden;
    margin: 0 auto 8px;
    max-width: 420px;
  }
  .progress span {
    display: block;
    height: 100%;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 12px, #e5a400 12px 24px);
    background-size: 34px 34px;
    animation: slide 1s linear infinite;
  }
  .progress-label { font-size: 15px; color: var(--steel); margin-bottom: 26px; }

  .call {
    background: var(--card);
    border-radius: 16px;
    border-right: 6px solid var(--yellow);
    padding: 18px 22px 16px;
    max-width: 440px;
    margin: 0 auto;
    box-shadow: 0 6px 24px rgba(20, 40, 61, .08);
    text-align: center;
  }
  .call p { margin: 0; font-weight: 700; font-size: clamp(17px, 4.4vw, 20px); line-height: 2; }

  /* انیمیشن‌ها */
  .scan  { animation: scan 4s linear infinite; }
  .lift  { animation: lift 2.2s ease-in-out infinite alternate; }
  .tick  { transform-box: fill-box; transform-origin: center; opacity: 0; animation-duration: 4s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
  .t-top { animation-name: tick-top; }
  .t-mid { animation-name: tick-mid; }
  .t-bot { animation-name: tick-bot; }

  @keyframes slide { to { background-position: 34px 0; } }
  @keyframes lift { from { transform: translateY(0); } to { transform: translateY(-9px); } }
  @keyframes scan {
    0%   { transform: translateY(0); opacity: 0; }
    4%   { opacity: 1; }
    92%  { transform: translateY(290px); opacity: 1; }
    100% { transform: translateY(290px); opacity: 0; }
  }
  @keyframes tick-top {
    0%, 18%  { opacity: 0; transform: scale(.4); }
    22%      { opacity: 1; transform: scale(1.15); }
    26%, 94% { opacity: 1; transform: scale(1); }
    100%     { opacity: 0; transform: scale(1); }
  }
  @keyframes tick-mid {
    0%, 49%  { opacity: 0; transform: scale(.4); }
    53%      { opacity: 1; transform: scale(1.15); }
    57%, 94% { opacity: 1; transform: scale(1); }
    100%     { opacity: 0; transform: scale(1); }
  }
  @keyframes tick-bot {
    0%, 79%  { opacity: 0; transform: scale(.4); }
    83%      { opacity: 1; transform: scale(1.15); }
    87%, 94% { opacity: 1; transform: scale(1); }
    100%     { opacity: 0; transform: scale(1); }
  }

  @media (min-width: 820px) {
    main { grid-template-columns: 1fr 1fr; text-align: right; justify-items: stretch; }
    .art { justify-self: center; width: 100%; max-width: 420px; }
    .progress { margin-inline: 0; }
    .call { margin-inline: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scan, .lift, .progress span { animation: none; }
    .scan { display: none; }
    .tick { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="tape" aria-hidden="true"></div>

<main>
  <div class="art">
    <svg viewBox="0 0 400 400" role="img" aria-label="قفسه انبار با کارتن‌هایی که در حال شمارش هستند">
      <defs>
        <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffbf1f" stop-opacity="0"/>
          <stop offset="1" stop-color="#ffbf1f" stop-opacity=".4"/>
        </linearGradient>
      </defs>

      <!-- قفسه -->
      <rect x="40" y="40" width="10" height="308" rx="2" fill="#14283d"/>
      <rect x="350" y="40" width="10" height="308" rx="2" fill="#14283d"/>
      <rect x="40" y="140" width="320" height="8" fill="#5b7188"/>
      <rect x="40" y="240" width="320" height="8" fill="#5b7188"/>
      <rect x="40" y="340" width="320" height="8" fill="#5b7188"/>
      <rect x="30" y="348" width="340" height="6" rx="3" fill="#14283d"/>

      <!-- کارتن‌ها -->
      <g>
        <g transform="translate(62 262)"><rect width="88" height="78" rx="3" fill="#9fb1c3"/><rect x="37" y="0" width="14" height="33" fill="#14283d" opacity=".22"/><line x1="0" y1="12" x2="88" y2="12" stroke="#14283d" stroke-opacity=".28" stroke-width="2"/><rect x="8" y="56" width="26" height="12" rx="2" fill="#fff" opacity=".7"/></g>
        <g transform="translate(160 282)"><rect width="70" height="58" rx="3" fill="#5b7188"/><rect x="28" y="0" width="14" height="24" fill="#14283d" opacity=".22"/><line x1="0" y1="12" x2="70" y2="12" stroke="#14283d" stroke-opacity=".28" stroke-width="2"/><rect x="8" y="36" width="26" height="12" rx="2" fill="#fff" opacity=".7"/></g>
        <g transform="translate(240 252)"><rect width="100" height="88" rx="3" fill="#5b7188"/><rect x="43" y="0" width="14" height="37" fill="#14283d" opacity=".22"/><line x1="0" y1="12" x2="100" y2="12" stroke="#14283d" stroke-opacity=".28" stroke-width="2"/><rect x="8" y="66" width="26" height="12" rx="2" fill="#fff" opacity=".7"/></g>
        <g transform="translate(62 170)"><rect width="68" height="70" rx="3" fill="#5b7188"/><rect x="27" y="0" width="14" height="29" fill="#14283d" opacity=".22"/><line x1="0" y1="12" x2="68" y2="12" stroke="#14283d" stroke-opacity=".28" stroke-width="2"/><rect x="8" y="48" width="26" height="12" rx="2" fill="#fff" opacity=".7"/></g>
        <g class="lift"><g transform="translate(140 182)"><rect width="96" height="58" rx="3" fill="#ffbf1f"/><rect x="41" y="0" width="14" height="24" fill="#14283d" opacity=".22"/><line x1="0" y1="12" x2="96" y2="12" stroke="#14283d" stroke-opacity=".28" stroke-width="2"/><rect x="8" y="36" width="26" height="12" rx="2" fill="#fff" opacity=".7"/></g></g>
        <g transform="translate(248 162)"><rect width="86" height="78" rx="3" fill="#9fb1c3"/><rect x="36" y="0" width="14" height="33" fill="#14283d" opacity=".22"/><line x1="0" y1="12" x2="86" y2="12" stroke="#14283d" stroke-opacity=".28" stroke-width="2"/><rect x="8" y="56" width="26" height="12" rx="2" fill="#fff" opacity=".7"/></g>
        <g transform="translate(62 72)"><rect width="76" height="68" rx="3" fill="#9fb1c3"/><rect x="31" y="0" width="14" height="29" fill="#14283d" opacity=".22"/><line x1="0" y1="12" x2="76" y2="12" stroke="#14283d" stroke-opacity=".28" stroke-width="2"/><rect x="8" y="46" width="26" height="12" rx="2" fill="#fff" opacity=".7"/></g>
        <g transform="translate(150 92)"><rect width="60" height="48" rx="3" fill="#5b7188"/><rect x="23" y="0" width="14" height="20" fill="#14283d" opacity=".22"/><line x1="0" y1="12" x2="60" y2="12" stroke="#14283d" stroke-opacity=".28" stroke-width="2"/><rect x="8" y="26" width="26" height="12" rx="2" fill="#fff" opacity=".7"/></g>
        <g transform="translate(222 66)"><rect width="100" height="74" rx="3" fill="#9fb1c3"/><rect x="43" y="0" width="14" height="31" fill="#14283d" opacity=".22"/><line x1="0" y1="12" x2="100" y2="12" stroke="#14283d" stroke-opacity=".28" stroke-width="2"/><rect x="8" y="52" width="26" height="12" rx="2" fill="#fff" opacity=".7"/></g>
        </g>

      <!-- تیک شمارش -->
      <g>
        <g class="tick t-bot"><circle cx="106" cy="307" r="12" fill="#ffbf1f" stroke="#14283d" stroke-width="2.5"/><path d="M101 307 l4 4.5 l7 -8.5" fill="none" stroke="#14283d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="tick t-bot"><circle cx="195" cy="317" r="12" fill="#ffbf1f" stroke="#14283d" stroke-width="2.5"/><path d="M190 317 l4 4.5 l7 -8.5" fill="none" stroke="#14283d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="tick t-bot"><circle cx="290" cy="302" r="12" fill="#ffbf1f" stroke="#14283d" stroke-width="2.5"/><path d="M285 302 l4 4.5 l7 -8.5" fill="none" stroke="#14283d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="tick t-mid"><circle cx="96" cy="211" r="12" fill="#ffbf1f" stroke="#14283d" stroke-width="2.5"/><path d="M91 211 l4 4.5 l7 -8.5" fill="none" stroke="#14283d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="tick t-mid"><circle cx="188" cy="217" r="12" fill="#ffbf1f" stroke="#14283d" stroke-width="2.5"/><path d="M183 217 l4 4.5 l7 -8.5" fill="none" stroke="#14283d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="tick t-mid"><circle cx="291" cy="207" r="12" fill="#ffbf1f" stroke="#14283d" stroke-width="2.5"/><path d="M286 207 l4 4.5 l7 -8.5" fill="none" stroke="#14283d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="tick t-top"><circle cx="100" cy="112" r="12" fill="#ffbf1f" stroke="#14283d" stroke-width="2.5"/><path d="M95 112 l4 4.5 l7 -8.5" fill="none" stroke="#14283d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="tick t-top"><circle cx="180" cy="122" r="12" fill="#ffbf1f" stroke="#14283d" stroke-width="2.5"/><path d="M175 122 l4 4.5 l7 -8.5" fill="none" stroke="#14283d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="tick t-top"><circle cx="272" cy="109" r="12" fill="#ffbf1f" stroke="#14283d" stroke-width="2.5"/><path d="M267 109 l4 4.5 l7 -8.5" fill="none" stroke="#14283d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
        </g>

      <!-- اسکنر -->
      <g class="scan">
        <rect x="44" y="22" width="312" height="28" fill="url(#trail)"/>
        <rect x="44" y="50" width="312" height="4" rx="2" fill="#ffbf1f"/>
      </g>
    </svg>
  </div>

  <section>
    <h1>در حال انبارگردانی هستیم</h1>

    <div class="progress" role="progressbar" aria-label="در حال انبارگردانی"><span></span></div>
    <div class="progress-label">از صبوری شما سپاسگزاریم</div>

    <div class="call">
      <p>به دلیل انبارگردانی، فروشگاه تا اطلاع ثانوی تعطیل است.</p>
    </div>
  </section>
</main>

<div class="tape" aria-hidden="true"></div>

</body>
</html>
