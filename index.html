<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>در حال بروزرسانی</title>
<style>
  :root {
    --bg: #eef2f6;
    --ink: #14283d;
    --steel: #5b7188;
    --yellow: #ffbf1f;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Vazirmatn", "Vazir", "IRANSans", Tahoma, "Segoe UI", system-ui, sans-serif;
    line-height: 1.9;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .tape {
    height: 14px;
    flex: none;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 18px, var(--ink) 18px 36px);
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 28px 20px;
    display: grid;
    gap: 8px 48px;
    align-items: center;
    justify-items: center;
    text-align: center;
  }

  .art { width: min(380px, 84vw); }
  .art svg { display: block; width: 100%; height: auto; overflow: visible; }

  h1 {
    margin: 0 0 22px;
    font-size: clamp(28px, 7vw, 46px);
    line-height: 1.5;
    font-weight: 800;
  }

  .progress {
    height: 12px;
    border-radius: 6px;
    background: #dbe3eb;
    overflow: hidden;
    margin: 0 auto 8px;
    max-width: 420px;
  }
  .progress span {
    display: block;
    height: 100%;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 12px, #e5a400 12px 24px);
    background-size: 34px 34px;
    animation: slide 1s linear infinite;
  }
  .progress-label { font-size: 15px; color: var(--steel); margin-bottom: 26px; }

  .call {
    background: var(--card);
    border-radius: 16px;
    border-right: 6px solid var(--yellow);
    padding: 18px 22px 16px;
    max-width: 440px;
    margin: 0 auto;
    box-shadow: 0 6px 24px rgba(20, 40, 61, .08);
    text-align: center;
  }
  .call p { margin: 0 0 4px; font-weight: 700; font-size: 16px; }
  .number {
    display: block;
    direction: ltr;
    font-size: clamp(30px, 8vw, 40px);
    font-weight: 800;
    letter-spacing: 1px;
  }

  .gear { transform-box: fill-box; transform-origin: center; }
  .g-big   { animation: spin 40s linear infinite; }
  .g-mid   { animation: spin 20s linear infinite reverse; }
  .g-small { animation: spin 15s linear infinite reverse; }
  .wrench  { animation: tighten 2.4s ease-in-out infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slide { to { background-position: 34px 0; } }
  @keyframes tighten {
    0%, 100% { transform: rotate(24deg); }
    50%      { transform: rotate(72deg); }
  }

  @media (min-width: 820px) {
    main { grid-template-columns: 1fr 1fr; text-align: right; justify-items: stretch; }
    .art { justify-self: center; width: 100%; max-width: 420px; }
    .progress { margin-inline: 0; }
    .call { margin-inline: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .gear, .wrench, .progress span { animation: none; }
    .wrench { transform: rotate(45deg); }
  }
</style>
</head>
<body>

<div class="tape" aria-hidden="true"></div>

<main>
  <div class="art">
    <svg viewBox="0 0 400 400" role="img" aria-label="چرخ‌دنده‌هایی که در حال تعمیر با آچار هستند">
      <defs>
        <mask id="jaw" maskUnits="userSpaceOnUse" x="-60" y="-60" width="240" height="120">
          <rect x="-60" y="-60" width="240" height="120" fill="#fff"/>
          <rect x="-60" y="-15" width="62" height="30" fill="#000"/>
        </mask>
      </defs>

      <g class="gear g-big">
        <circle cx="200" cy="200" r="78" fill="#5b7188"/>
        <circle cx="200" cy="200" r="88" fill="none" stroke="#5b7188" stroke-width="20" pathLength="32" stroke-dasharray="1 1"/>
        <g fill="#eef2f6">
          <circle cx="250" cy="200" r="11"/>
          <circle cx="225" cy="243.3" r="11"/>
          <circle cx="175" cy="243.3" r="11"/>
          <circle cx="150" cy="200" r="11"/>
          <circle cx="175" cy="156.7" r="11"/>
          <circle cx="225" cy="156.7" r="11"/>
        </g>
        <circle cx="200" cy="200" r="30" fill="#3f5368"/>
      </g>

      <g class="gear g-mid">
        <circle cx="312" cy="106" r="34" fill="#14283d"/>
        <circle cx="312" cy="106" r="42" fill="none" stroke="#14283d" stroke-width="14" pathLength="16" stroke-dasharray="1 1"/>
        <circle cx="312" cy="106" r="12" fill="#eef2f6"/>
      </g>

      <g class="gear g-small">
        <circle cx="108" cy="302" r="28" fill="#9fb1c3"/>
        <circle cx="108" cy="302" r="35" fill="none" stroke="#9fb1c3" stroke-width="12" pathLength="12" stroke-dasharray="1 1"/>
        <circle cx="108" cy="302" r="10" fill="#eef2f6"/>
      </g>

      <g transform="translate(200 200)">
        <g class="wrench">
          <polygon points="17,0 8.5,14.7 -8.5,14.7 -17,0 -8.5,-14.7 8.5,-14.7" fill="#14283d"/>
          <g mask="url(#jaw)" fill="#ffbf1f">
            <circle cx="0" cy="0" r="36"/>
            <rect x="20" y="-10" width="135" height="20" rx="10"/>
            <circle cx="140" cy="0" r="4" fill="#14283d"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <section>
    <h1>در حال بروزرسانی هستیم</h1>

    <div class="progress" role="progressbar" aria-label="در حال بروزرسانی"><span></span></div>
    <div class="progress-label">به‌زودی برمی‌گردیم</div>

    <div class="call">
      <p>برای استعلام قیمت از شماره تلفن فروشگاه استفاده کنید</p>
      <span class="number">۰۲۵-۳۶۶۶۴۶۶۶</span>
    </div>
  </section>
</main>

<div class="tape" aria-hidden="true"></div>

</body>
</html>
